name: Native release gate
# Fixed runner map in src/release-matrix.ts: macos-15-intel, macos-15,
# ubuntu-24.04-arm, windows-11-arm, windows-2025 and Alpine musl containers.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tagged source on main and exact version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bounded-dev/bounded
          test "$GITHUB_REF" = "refs/tags/v$(jq -r .version src/package.json)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate source and declaration
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
          printf 'matrix=%s\n' "$(bun src/release-matrix.ts)" >> "$GITHUB_OUTPUT"
      - name: Real certificate run invocation feasibility probe
        shell: bash
        run: printf 'native release attestation probe\n' > attestation-probe.txt
      - uses: actions/attest@v4
        with:
          subject-path: attestation-probe.txt
      - name: Verify probe certificate from this run attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify attestation-probe.txt --repo bounded-dev/bounded --signer-workflow bounded-dev/bounded/.github/workflows/release.yml --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners --format json > probe-verification.json
          jq -e --arg uri "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" 'length == 1 and .[0].verificationResult.signature.certificate.runInvocationURI == $uri' probe-verification.json
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install and check on native runner
        shell: bash
        if: ${{ !startsWith(matrix.target, 'windows-') && !endsWith(matrix.target, '-musl') }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
      - name: Check on native Windows runner
        shell: pwsh
        if: ${{ startsWith(matrix.target, 'windows-') }}
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'bun install failed' }
          bun run check
          if ($LASTEXITCODE -ne 0) { throw 'bun run check failed' }
      - name: Build stable archive on native Linux runner
        shell: bash
        if: ${{ startsWith(matrix.target, 'linux-') && !endsWith(matrix.target, '-musl') }}
        run: |
          set -euo pipefail
          bun src/build-release.ts --target '${{ matrix.target }}' --out "native-job/${{ matrix.target }}"
          manifest=$(find "native-job/${{ matrix.target }}" -name '*manifest-v1.json' -print -quit)
          expected="Linux kernel $(uname -r), glibc $(getconf GNU_LIBC_VERSION | cut -d ' ' -f 2)"
          test "$(jq -r '.targets["${{ matrix.target }}"].minimumOS' "$manifest")" = "$expected"
      - name: Import macOS Developer ID identity
        shell: bash
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          SIGNING_P12_BASE64: ${{ secrets.BOUNDED_MACOS_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.BOUNDED_MACOS_SIGNING_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BOUNDED_MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_P12_BASE64" && test -n "$SIGNING_P12_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/bounded-signing.keychain-db"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Compile, codesign and package signed macOS executable
        shell: bash
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          SIGNING_IDENTITY: ${{ secrets.BOUNDED_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY"
          bun src/build-release.ts --target '${{ matrix.target }}' --compile-only --out "native-job/${{ matrix.target }}"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" src/dist/standalone/bounded
          codesign --verify --strict --verbose=2 src/dist/standalone/bounded
          bun src/build-release.ts --target '${{ matrix.target }}' --package-signed --out "native-job/${{ matrix.target }}"
          manifest=$(find "native-job/${{ matrix.target }}" -name '*manifest-v1.json' -print -quit)
          test "$(jq -r '.targets["${{ matrix.target }}"].minimumOS' "$manifest")" = "macOS $(sw_vers -productVersion)"
      - name: Build stable archive in native Alpine musl container
        shell: bash
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')" -v "$PWD:/work" -w /work -e GITHUB_SHA alpine:3.21 sh -ec '
            apk add --no-cache bash curl unzip git jq libstdc++
            curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile
            bun run check
            bun src/build-release.ts --target "${{ matrix.target }}" --out "native-job/${{ matrix.target }}"
            manifest=$(find "native-job/${{ matrix.target }}" -name "*manifest-v1.json" -print -quit)
            observed=$(jq -r ".targets[\"${{ matrix.target }}\"].minimumOS" "$manifest")
            musl_version=$(ldd --version 2>&1 | grep "^Version " | head -n 1 | cut -d " " -f 2)
            test "$observed" = "Linux kernel $(uname -r), musl $musl_version"
          '
      - name: Build stable archive on native Windows runner
        shell: pwsh
        if: ${{ startsWith(matrix.target, 'windows-') }}
        run: |
          bun src/build-release.ts --target '${{ matrix.target }}' --out 'native-job/${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'native build failed' }
          $manifest = Get-ChildItem 'native-job/${{ matrix.target }}' -Filter '*manifest-v1.json' | Select-Object -First 1
          $release = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $minimumOS = $release.targets.'${{ matrix.target }}'.minimumOS
          $observed = [Environment]::OSVersion.Version.ToString(3)
          if ($minimumOS -ne "Windows kernel $observed") { throw 'minimumOS does not match native Windows kernel' }
      - name: Notarize exact final macOS ZIP and check downloaded distribution
        shell: bash
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        env:
          APPLE_ID: ${{ secrets.BOUNDED_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.BOUNDED_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.BOUNDED_APP_PASSWORD }}
        run: |
          set -euo pipefail
          archive="native-job/${{ matrix.target }}/bounded-v$(jq -r .version src/package.json)-${{ matrix.target }}.zip"
          before=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > notary-result.json
          jq -e '.status == "Accepted"' notary-result.json
          after=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          test "$before" = "$after"
          cp "$archive" downloaded-distribution.zip
          unzip -q downloaded-distribution.zip -d downloaded-distribution
          binary=$(find downloaded-distribution -path '*/bin/bounded' -type f -print -quit)
          codesign --verify --strict --verbose=2 "$binary"
          xattr -w com.apple.quarantine '0081;00000000;Bounded;00000000' "$binary"
          spctl --assess --type execute --verbose "$binary"
          "$binary" --version
          # Online first launch above; the installed Bounded process is then checked with network denied.
      - name: Native Windows install.ps1 bounded.cmd hook claude-code and failed install rollback without node bun npm runtimes
        shell: pwsh
        if: ${{ startsWith(matrix.target, 'windows-') }}
        run: |
          scripts/release/windows-native-smoke.ps1 'native-job/${{ matrix.target }}'
      - name: Native Unix install.sh, launcher, hook and rollback without runtimes
        shell: bash
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        run: scripts/release/unix-native-smoke.sh 'native-job/${{ matrix.target }}'
      - uses: actions/attest@v4
        with:
          subject-path: native-job/${{ matrix.target }}/bounded-v*-${{ matrix.target }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-job/${{ matrix.target }}/
          if-no-files-found: error
  assemble:
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-job
          merge-multiple: false
      - name: Assemble only the declared attested jobs from this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          inputs=()
          while IFS= read -r target; do inputs+=(--input "native-job/native-$target"); done < <(jq -r '.targets[]' src/release-targets.json)
          bun src/build-release.ts --assemble "${inputs[@]}" --out release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "$(($(jq '.targets | length' src/release-targets.json) + 3))"
      - name: Create verified private draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then echo 'Release already exists; refusing to mutate it' >&2; exit 1; fi
          gh release create "$tag" --draft --verify-tag --title "$tag" --notes 'Native release candidate pending maintainer review.'
          cleanup() { gh release delete "$tag" --yes 2>/dev/null || true; }
          trap cleanup ERR
          gh release upload "$tag" release-assets/*
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-pages.json
          release_id=$(jq -er --arg tag "$tag" '[.[][] | select(.tag_name == $tag and .draft == true)] | if length == 1 then .[0].id else error("expected exactly one newly created draft") end' release-pages.json)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release-assets.json
          jq -e --arg tag "$tag" --argjson id "$release_id" '.id == $id and .tag_name == $tag and .draft == true' release-assets.json
          bun scripts/release/verify-draft-assets.ts release-assets release-assets.json
          trap - ERR
