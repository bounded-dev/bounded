name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      # The ts pack's reference typecheck, bun suite and valid-red runs skip
      # with a logged reason when bun is missing on a developer machine; in CI
      # a missing bun is a failure, never a silent skip.
      BOUNDED_REQUIRE_BUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          # Exact pin: the harness's generated projects and the reference
          # checks run on this Bun (ADR LEG-2026-062).
          bun-version: 1.3.14
      - run: bun --version
      - run: npm ci
      - run: npm run check
      - run: npm test
