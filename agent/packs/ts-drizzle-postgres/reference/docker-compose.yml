# Local development database, shared by every app. Generated by the
# ts-drizzle-postgres capability; the database is named after the project.
services:
  postgres:
    # Pinned to an exact version, unlike the worked example's postgres:17, so
    # every machine runs the same server; the store tests start this image too.
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{project}}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
